version: "3.9"
services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: paashu_db
      POSTGRES_USER: paashu_user
      POSTGRES_PASSWORD: paashu_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    env_file:
      - ../backend/.env
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ../backend:/app

  frontend:
    build: ../frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
